# Installed to /etc/systemd/journald.conf.d/90-mm-fridge.conf by install.sh.
# Keeps the logs across reboots so a freeze can be diagnosed after the power
# cycle (journald.conf(5): "auto" keeps them only if /var/log/journal exists),
# capped to spare the SD card.
# Undo: sudo rm /etc/systemd/journald.conf.d/90-mm-fridge.conf && sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=200M
