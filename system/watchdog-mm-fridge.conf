# Installed to /etc/systemd/system.conf.d/90-mm-fridge-watchdog.conf by install.sh.
# The Pi's hardware watchdog reboots the Pi if the kernel or systemd stop
# responding for 15 s (systemd-system.conf(5) RuntimeWatchdogSec=; off by
# default). 15 s is within the Pi 4 watchdog's limit (bcm2835_wdt, about 16 s).
# It does not catch a Pi that is slow but alive. For the screen, MMM-Guard
# restarts MagicMirror when its page crashes (also when killed for lack of
# memory) or stops responding.
# Undo: sudo rm /etc/systemd/system.conf.d/90-mm-fridge-watchdog.conf && sudo systemctl daemon-reexec
[Manager]
RuntimeWatchdogSec=15s
